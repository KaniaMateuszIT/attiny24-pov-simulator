# Wersja online symulatora: folder "aplikacja" publikowany na GitHub Pages.
# Bez serwera nie ma kompilatora - przykłady korzystają z gotowych wyników w aplikacja/przyklady/build
# (po zmianie przykładów: uruchom symulator i "node tools/zbuduj-przyklady.mjs").
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: aplikacja
      - id: deployment
        uses: actions/deploy-pages@v4
